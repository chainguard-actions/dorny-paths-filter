name: Test list-files csv output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test files and commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p src
          echo "console.log('a');" > src/a.js
          echo "console.log('b');" > src/b.js
          git add src/a.js src/b.js
          git commit -m "test: add js files for csv filter test"

      - name: Get base SHA (commit before the test commit)
        id: get-sha
        run: |
          echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - id: filter
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          list-files: csv
          filters: |
            javascript:
              - '**/*.js'

      - name: Assert javascript filter matched
        env:
          JS_MATCHED: ${{ steps.filter.outputs.javascript }}
        run: |
          echo "javascript matched: $JS_MATCHED"
          if [ "$JS_MATCHED" != "true" ]; then
            echo "FAIL: expected javascript filter to match"
            exit 1
          fi
          echo "PASS: javascript filter matched"

      - name: Assert javascript_files is non-empty CSV
        env:
          JS_FILES: ${{ steps.filter.outputs.javascript_files }}
        run: |
          echo "javascript_files: $JS_FILES"
          if [ -z "$JS_FILES" ]; then
            echo "FAIL: expected javascript_files to be non-empty CSV"
            exit 1
          fi
          # Should contain at least one .js file
          if ! echo "$JS_FILES" | grep -q "\.js"; then
            echo "FAIL: expected javascript_files to contain .js files, got: $JS_FILES"
            exit 1
          fi
          echo "PASS: javascript_files is non-empty CSV containing .js files"
