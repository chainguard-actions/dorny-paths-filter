name: Test ref input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          ref: act-harness
          base: act-harness
          filters: |
            src:
              - '**/*.js'
            docs:
              - '**/*.md'
      - name: Assert changes output is a JSON array
        env:
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          # Should be a valid JSON array (possibly empty)
          if ! echo "$CHANGES" | grep -qE '^\['; then
            echo "FAIL: expected changes to be a JSON array, got: $CHANGES"
            exit 1
          fi
          echo "PASS: changes output is a JSON array"
      - name: Assert src output exists
        env:
          SRC: ${{ steps.action.outputs.src }}
        run: |
          echo "src: $SRC"
          if [ "$SRC" != "true" ] && [ "$SRC" != "false" ]; then
            echo "FAIL: expected src to be 'true' or 'false', got: $SRC"
            exit 1
          fi
          echo "PASS: src output is valid"
