name: Test multiple filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test files and commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p src docs
          echo "console.log('hello');" > src/app.js
          echo "# Documentation" > docs/readme.md
          git add src/app.js docs/readme.md
          git commit -m "test: add js and md files for filter test"

      - name: Get base SHA (commit before the test commit)
        id: get-sha
        run: |
          echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - id: filter
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          filters: |
            javascript:
              - '**/*.js'
            markdown:
              - '**/*.md'
            python:
              - '**/*.py'

      - name: Assert javascript filter matched
        env:
          JS_MATCHED: ${{ steps.filter.outputs.javascript }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          echo "javascript matched: $JS_MATCHED"
          if [ "$JS_MATCHED" != "true" ]; then
            echo "FAIL: expected javascript filter to match (src/app.js was added)"
            exit 1
          fi
          echo "PASS: javascript filter matched"

      - name: Assert markdown filter matched
        env:
          MD_MATCHED: ${{ steps.filter.outputs.markdown }}
        run: |
          echo "markdown matched: $MD_MATCHED"
          if [ "$MD_MATCHED" != "true" ]; then
            echo "FAIL: expected markdown filter to match (docs/readme.md was added)"
            exit 1
          fi
          echo "PASS: markdown filter matched"

      - name: Assert python filter did not match
        env:
          PY_MATCHED: ${{ steps.filter.outputs.python }}
        run: |
          echo "python matched: $PY_MATCHED"
          if [ "$PY_MATCHED" != "false" ]; then
            echo "FAIL: expected python filter NOT to match (no .py files changed)"
            exit 1
          fi
          echo "PASS: python filter did not match"

      - name: Assert changes JSON array contains javascript and markdown but not python
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          python3 - <<'PYEOF'
          import sys, json, os
          data = json.loads(os.environ['CHANGES'])
          assert 'javascript' in data, 'javascript not in changes: ' + str(data)
          assert 'markdown' in data, 'markdown not in changes: ' + str(data)
          assert 'python' not in data, 'python should not be in changes: ' + str(data)
          print('PASS: changes array is correct')
          PYEOF
