name: Test base input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a base commit to compare against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a test branch to use as base
          git checkout -b test-base-branch
          git checkout act-harness

      - id: action
        uses: .
        with:
          base: test-base-branch
          filters: |
            src:
              - '**/*.js'
              - '**/*.ts'
            docs:
              - '**/*.md'
            any:
              - '**'
        continue-on-error: true

      - name: Assert action ran and produced output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHANGES" ]; then
              echo "FAIL: action succeeded but changes output is empty"
              exit 1
            fi
            echo "PASS: base input accepted, changes=$CHANGES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when base branch comparison is not possible in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
