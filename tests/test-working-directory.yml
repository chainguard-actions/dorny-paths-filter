name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: myrepo
      - id: action
        uses: .
        with:
          working-directory: myrepo
          base: act-harness
          filters: |
            src:
              - '**/*.js'
            docs:
              - '**/*.md'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
      - name: Assert changes output is a JSON array
        env:
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          # Should be a valid JSON array
          if ! echo "$CHANGES" | grep -qE '^\['; then
            echo "FAIL: expected changes to be a JSON array, got: $CHANGES"
            exit 1
          fi
          echo "PASS: changes output is a JSON array"
      - name: Assert yaml output exists
        env:
          YAML_OUT: ${{ steps.action.outputs.yaml }}
        run: |
          echo "yaml: $YAML_OUT"
          if [ "$YAML_OUT" != "true" ] && [ "$YAML_OUT" != "false" ]; then
            echo "FAIL: expected yaml to be 'true' or 'false', got: $YAML_OUT"
            exit 1
          fi
          echo "PASS: yaml output is valid"
