name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: myrepo
      - id: action
        uses: .
        with:
          working-directory: myrepo
          filters: |
            src:
              - '**/*.js'
            docs:
              - '**/*.md'
      - name: Assert changes output is a JSON array
        env:
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          # Output should be a valid JSON array (possibly empty)
          if ! echo "$CHANGES" | grep -qE '^\[.*\]$'; then
            echo "FAIL: expected a JSON array, got: $CHANGES"
            exit 1
          fi
          echo "PASS: changes output is a JSON array"
