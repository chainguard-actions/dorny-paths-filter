name: Test basic inline filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Stage a file change for detection
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello world" > test-change.txt
          git add test-change.txt

      - id: filter
        uses: .
        with:
          # base: HEAD detects staged/unstaged changes vs HEAD (no commit needed)
          base: HEAD
          filters: |
            any:
              - '**'

      - name: Assert changes output is a JSON array
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "changes: $CHANGES"
          # The output should be a valid JSON array (either empty [] or with items)
          if ! echo "$CHANGES" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list)" 2>/dev/null; then
            echo "FAIL: 'changes' output is not a valid JSON array: $CHANGES"
            exit 1
          fi
          echo "PASS: changes output is a valid JSON array"

      - name: Assert any filter matched the staged file
        env:
          ANY_MATCHED: ${{ steps.filter.outputs.any }}
        run: |
          echo "any matched: $ANY_MATCHED"
          if [ "$ANY_MATCHED" != "true" ]; then
            echo "FAIL: expected 'any' filter to match staged file"
            exit 1
          fi
          echo "PASS: any filter matched"
