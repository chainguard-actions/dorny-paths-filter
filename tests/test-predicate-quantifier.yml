name: Test predicate-quantifier every
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create test files and commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p src
          echo "console.log('hello');" > src/app.js
          git add src/app.js
          git commit -m "test: add js file for predicate-quantifier test"

      - name: Get base SHA (commit before the test commit)
        id: get-sha
        run: |
          echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Run filter with predicate-quantifier=some (default)
        id: filter-some
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          predicate-quantifier: some
          filters: |
            mixed:
              - '**/*.js'
              - '**/*.py'

      - name: Assert mixed filter matched with some (js file present)
        env:
          MIXED_MATCHED: ${{ steps.filter-some.outputs.mixed }}
        run: |
          echo "mixed matched (some): $MIXED_MATCHED"
          if [ "$MIXED_MATCHED" != "true" ]; then
            echo "FAIL: expected mixed filter to match with predicate-quantifier=some (js file changed)"
            exit 1
          fi
          echo "PASS: mixed filter matched with predicate-quantifier=some"

      - name: Run filter with predicate-quantifier=every
        id: filter-every
        uses: .
        with:
          base: ${{ steps.get-sha.outputs.sha }}
          predicate-quantifier: every
          filters: |
            mixed:
              - '**/*.js'
              - '**/*.py'

      - name: Assert mixed filter did not match with every (no py file)
        env:
          MIXED_MATCHED: ${{ steps.filter-every.outputs.mixed }}
        run: |
          echo "mixed matched (every): $MIXED_MATCHED"
          # With predicate-quantifier=every, ALL patterns must match.
          # Only .js was changed, not .py, so mixed should be false.
          if [ "$MIXED_MATCHED" != "false" ]; then
            echo "FAIL: expected mixed filter NOT to match with predicate-quantifier=every (no .py file changed)"
            exit 1
          fi
          echo "PASS: mixed filter did not match with predicate-quantifier=every"
