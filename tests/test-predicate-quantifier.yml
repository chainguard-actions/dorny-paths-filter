name: Test predicate-quantifier every
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: .
        continue-on-error: true
        with:
          predicate-quantifier: every
          filters: |
            typescript_tests:
              - 'tests/**'
              - '**/*.ts'
            all_files:
              - '**'

      - name: Assert predicate-quantifier every works
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          echo "all_files: $ALL_FILES"
          if [ "$OUTCOME" = "success" ]; then
            # changes output should be a valid JSON array
            if [ -z "$CHANGES" ]; then
              echo "FAIL: action succeeded but 'changes' output is empty"
              exit 1
            fi
            echo "$CHANGES" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Not a JSON array'" || {
              echo "FAIL: 'changes' output is not a valid JSON array: $CHANGES"
              exit 1
            }
            # all_files should be 'true' or 'false'
            if [ "$ALL_FILES" != "true" ] && [ "$ALL_FILES" != "false" ]; then
              echo "FAIL: 'all_files' output should be 'true' or 'false', got: $ALL_FILES"
              exit 1
            fi
            echo "PASS: changes=$CHANGES all_files=$ALL_FILES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
